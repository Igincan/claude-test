# Publishes the site to GitHub Pages (gh-pages branch):
#   main          -> https://igincan.github.io/claude-test/
#   other branch  -> https://igincan.github.io/claude-test/preview/<branch>/
# Deleting a branch removes its preview.
name: GitHub Pages

on:
  push:
    branches-ignore: [gh-pages]
  delete:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          rsync -a --exclude='.git*' --exclude='_site' --exclude='CLAUDE.md' ./ _site/

      - name: Pick target folder
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "dir=preview/${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true
          commit_message: "Deploy ${{ github.ref_name }}"

  remove-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Delete preview folder
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          dir="preview/${BRANCH//\//-}"
          [ -d "$dir" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq "$dir"
          git commit -m "Remove preview for $BRANCH"
          git push
