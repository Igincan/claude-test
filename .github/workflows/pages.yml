# Publishes the site to GitHub Pages (gh-pages branch):
#   main          -> https://igincan.github.io/claude-test/
#   other branch  -> https://igincan.github.io/claude-test/preview/<branch>/
# Merging a PR deletes its branch; deleting a branch (merged or by hand) removes its preview.
name: GitHub Pages

on:
  push:
    branches-ignore: [gh-pages]
  # Run by hand to redeploy, e.g. after changing the COUNTDOWN_* repository variables.
  workflow_dispatch:
  pull_request:
    types: [closed]
  delete:

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          rsync -a --exclude='.git*' --exclude='_site' --exclude='CLAUDE.md' ./ _site/

      - name: Write countdown config from repository variables
        env:
          COUNTDOWN_TARGET: ${{ vars.COUNTDOWN_TARGET }}
          COUNTDOWN_LABEL: ${{ vars.COUNTDOWN_LABEL }}
        run: |
          {
            echo "window.COUNTDOWN_TARGET = $(jq -n --arg v "$COUNTDOWN_TARGET" '$v');"
            echo "window.COUNTDOWN_LABEL = $(jq -n --arg v "$COUNTDOWN_LABEL" '$v');"
          } > _site/config.js
          cat _site/config.js

      - name: Pick target folder
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "dir=preview/${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true
          commit_message: "Deploy ${{ github.ref_name }}"

  cleanup:
    # Runs when a PR from this repo is merged, or when a branch is deleted by hand.
    # Branch deletes made with GITHUB_TOKEN don't trigger the delete event, so the
    # merged-PR path removes the preview itself.
    if: >-
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Same group as deploy so the two never push to gh-pages at the same time.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || github.event.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Delete preview folder
        run: |
          dir="preview/${BRANCH//\//-}"
          [ -d "$dir" ] || { echo "No preview for $BRANCH"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq "$dir"
          git commit -m "Remove preview for $BRANCH"
          # Another deploy may push to gh-pages at the same time; rebase and retry.
          for i in 1 2 3 4 5; do
            git push origin HEAD:gh-pages && exit 0
            sleep $((i * 3))
            git pull --rebase origin gh-pages
          done
          exit 1

      - name: Delete merged branch
        if: github.event_name == 'pull_request' && env.BRANCH != 'main' && env.BRANCH != 'gh-pages'
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git push origin --delete "$BRANCH"
          else
            echo "$BRANCH already deleted"
          fi
