<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="stylesheet" href="style.css" />
  <script src="auth.js"></script>
  <script>
    // Guard: redirect to login if there's no session.
    if (!getSession()) location.replace("index.html");
  </script>
</head>
<body>
  <header>
    <span class="brand">MyApp</span>
    <button id="logout">Log out</button>
  </header>

  <main>
    <h1>Hello, <span id="user-name"></span> 👋</h1>
    <p class="muted">Signed in as <span id="user-email"></span> · since <span id="login-time"></span></p>

    <div class="grid">
      <div class="card">
        <h2>Projects</h2>
        <div class="value">12</div>
      </div>
      <div class="card">
        <h2>Open tasks</h2>
        <div class="value">34</div>
      </div>
      <div class="card">
        <h2>Messages</h2>
        <div class="value">5</div>
      </div>
    </div>
  </main>

  <script>
    const session = getSession();
    if (session) {
      document.getElementById("user-name").textContent = session.name;
      document.getElementById("user-email").textContent = session.email;
      document.getElementById("login-time").textContent =
        new Date(session.loggedInAt).toLocaleString();
    }

    document.getElementById("logout").addEventListener("click", () => {
      logout();
      location.href = "index.html";
    });
  </script>
</body>
</html>
